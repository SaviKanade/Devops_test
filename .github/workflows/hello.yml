#This is the hello workflow
name: hello workflow

#when this workflow will run. SO, basically whenever you push these listed branches it will run this workflow.
on:
  workflow_dispatch:


# These are the jobs inside a workflow
# every job needs seperate runner, its called parallesim
jobs:

#Name of a job
  greet:
  # Github runner (github gives its own server where you can run your steps). Each job runs on a runner.
    runs-on: ubuntu-latest
    steps: 
    - name: greeting
      run: echo "Hello "

    - name: say hello to username
      run: echo "hello $USER"

  details:
  # Below line shows the dependency of details job as it depends on greet job. Means it says 1st execute greet job then only execute my steps.
    needs: greet
    runs-on: ubuntu-latest
    steps:
      - name: show what all versions we use for python,docker
        run: docker -v && python -v
      
